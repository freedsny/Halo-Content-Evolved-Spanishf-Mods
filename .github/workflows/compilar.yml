name: Compilar Halo C.E Evolved (Content Evolved con trucos)

# Baja el codigo de Halo Content Evolved (github.com/Watanoge/halo-content-evolved,
# la ultima version), le aplica parche/trucos.patch (los trucos, la flecha guia y
# el HUD de Halo C.E, adaptados), pasa los menus al espanol, compila el APK de
# Android y lo deja en Releases. Es otra app ("Halo C.E Evolved",
# com.halo.decomp.evolved): se instala al lado de Halo C.E.

on:
  push:
    paths-ignore:
      - "**.md"
      - "capturas/**"
  workflow_dispatch:
    inputs:
      version:
        description: "Version de Content Evolved (ej. build-141). Vacio = la ultima"
        required: false
        default: ""

concurrency:
  group: apk-evolved-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  issues: write

env:
  CI_COMPILER_LAUNCHER: ccache
  CCACHE_DIR: ${{ github.workspace }}/src/.ccache
  CCACHE_BASEDIR: ${{ github.workspace }}/src
  CCACHE_MAXSIZE: 1G

jobs:
  android:
    # La imagen del runner trae el SDK y el NDK de Android, un JDK y CMake.
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Install the toolchain
        run: |
          mkdir -p "$RUNNER_TEMP/tools"
          curl -fsSL -o ninja.zip https://github.com/ninja-build/ninja/releases/download/v1.12.1/ninja-linux.zip
          curl -fsSL -o ccache.tar.xz https://github.com/ccache/ccache/releases/download/v4.10.2/ccache-4.10.2-linux-x86_64.tar.xz
          sha256sum -c - <<'HASHES'
          6f98805688d19672bd699fbbfa2c2cf0fc054ac3df1f0e6a47664d963d530255  ninja.zip
          80cab87bd510eca796467aee8e663c398239e0df1c4800a0b5dff11dca0b4f18  ccache.tar.xz
          HASHES
          unzip -q ninja.zip -d "$RUNNER_TEMP/tools" && rm ninja.zip
          tar -xJf ccache.tar.xz -C "$RUNNER_TEMP/tools" --strip-components=1 ccache-4.10.2-linux-x86_64/ccache && rm ccache.tar.xz
          echo "$RUNNER_TEMP/tools" >> "$GITHUB_PATH"

      - name: Buscar la ultima version de Content Evolved
        id: version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          ver="$VERSION"
          if [ -z "$ver" ]; then
            ver=$(git ls-remote --tags --refs https://github.com/Watanoge/halo-content-evolved.git 'build-*' | sed 's#.*refs/tags/##' | sort -V | tail -1)
          fi
          echo "Version de Content Evolved: $ver"
          echo "ref=$ver" >> "$GITHUB_OUTPUT"

      - name: Este repositorio (parche y script)
        uses: actions/checkout@v4
        with:
          path: repo

      - name: Codigo de Halo Content Evolved (la version elegida)
        uses: actions/checkout@v4
        with:
          repository: Watanoge/halo-content-evolved
          ref: ${{ steps.version.outputs.ref }}
          path: src

      # Para dibujar el menu en espanol (si falla, el menu queda en ingles)
      - name: Dependencias del menu en espanol
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-pil python3-numpy python3-scipy || echo "::warning::No se pudieron instalar las dependencias, el menu queda en ingles"

      - name: Aplicar los trucos
        working-directory: src
        run: |
          patch -p1 -l < ../repo/parche/trucos.patch
          /usr/bin/python3 ../repo/menus/regenerar_menus.py
          # El nombre de la app en el celular, y su propio paquete
          # (com.halo.decomp.evolved, HALO_APPLICATION_ID_SUFFIX de build.gradle):
          # se instala al lado de Halo C.E, con su propia carpeta y partidas. Las
          # pruebas son otra app mas (com.halo.decomp.evolved.pruebas).
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            nombre="Halo C.E Evolved"; sufijo=".evolved"
          else
            nombre="Evolved PRUEBA"; sufijo=".evolved.pruebas"
          fi
          sed -i "s#<string name=\"app_name\">Halo</string>#<string name=\"app_name\">$nombre</string>#" port/android/app/src/main/res/values/strings.xml
          echo "HALO_APPLICATION_ID_SUFFIX=$sufijo" >> "$GITHUB_ENV"
          grep -n 'app_name' port/android/app/src/main/res/values/strings.xml
          git status --short

      - uses: actions/cache@v4
        with:
          path: src/.ccache
          key: ccache-android-evolved-${{ github.sha }}
          restore-keys: ccache-android-evolved-

      - uses: actions/cache@v4
        with:
          path: src/build/android/third_party
          key: android-evolved-third-party-${{ hashFiles('src/tools/android_build.py', 'src/port/android/patches/**') }}

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('src/port/android/**/*.gradle*', 'src/port/android/gradle/wrapper/gradle-wrapper.properties') }}

      # La llave de firma (secretos ANDROID_KEYSTORE_BASE64 y
      # ANDROID_KEYSTORE_PASSWORD): con ella todas las versiones se instalan
      # una encima de otra sin borrar la partida.
      - name: Llave de firma
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            printf '%s' "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/halo.keystore"
            echo "HALO_ANDROID_KEYSTORE=$RUNNER_TEMP/halo.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::Faltan los secretos de firma: cada APK queda con una firma distinta"
          fi

      # Sin numero de compilacion (env -u GITHUB_REF) el juego no busca
      # actualizaciones de Content Evolved que pisarian los trucos.
      - name: Compilar el APK (release)
        working-directory: src
        env:
          HALO_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: env -u GITHUB_REF python3 tools/ci_build.py android release

      - name: Compile cache
        run: ccache --show-stats

      # Desde la build 142 Content Evolved deja el juego en
      # dist/halo-contentevolved-release, y en dist/halo-android-release su
      # "puente" para pasar de la app vieja a la nueva (aqui no se usa: la app
      # conserva su nombre, com.halo.decomp.evolved, ver parche/trucos.patch)
      - name: Ubicar el APK del juego
        run: |
          for d in src/dist/halo-contentevolved-release src/dist/halo-android-release; do
            if [ -f "$d/app-release.apk" ]; then
              mkdir -p src/dist/juego
              cp "$d/app-release.apk" src/dist/juego/
              echo "APK del juego: $d/app-release.apk"
              break
            fi
          done
          test -f src/dist/juego/app-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: halo-evolved-android-release
          path: src/dist/juego
          # las pruebas solo un dia: en un repositorio publico cualquiera con cuenta
          # de GitHub puede descargar un artifact
          retention-days: ${{ github.ref_name == 'main' && 7 || 1 }}

      - name: Publicar el APK en Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER="${{ steps.version.outputs.ref }}"
          NOTAS="APK de Halo C.E Evolved: Halo Content Evolved ($VER) con los trucos, la flecha guia y el HUD de Halo C.E, en espanol. Es otra app: se instala al lado de Halo C.E. Trucos: AJUSTES > tu perfil > JUEGO > TRUCOS (en partida: pausa > AJUSTES > JUEGO > TRUCOS)."
          CAMBIOS=$(cd repo && git log -1 --format='%s%n%n%b' | grep -v '^Co-Authored-By\|^Claude-Session' | sed '/./,$!d')
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            APK="HaloCE-Evolved-trucos-$VER-n${{ github.run_number }}.apk"
            cp src/dist/juego/app-release.apk "$APK"
            gh release create "evolved-$(date +%Y%m%d-%H%M)" "$APK" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Halo C.E Evolved con trucos - Content Evolved $VER (#${{ github.run_number }})" \
              --notes "$(printf '%s\n\n## Cambios\n%s' "$NOTAS" "$CAMBIOS")" \
              --latest
          else
            # Las pruebas son privadas: BORRADOR (draft), que solo ve el dueno.
            # Se borran las pruebas anteriores.
            for viejo in $(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName,isDraft,name \
                --jq '.[] | select(.isDraft and (.name | startswith("EVOLVED PRUEBA"))) | .tagName'); do
              gh release delete "$viejo" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
            done
            APK="HaloCE-Evolved-PRUEBA-$VER-n${{ github.run_number }}.apk"
            cp src/dist/juego/app-release.apk "$APK"
            gh release create "evolved-prueba-$(date +%Y%m%d-%H%M)" "$APK" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "EVOLVED PRUEBA ($GITHUB_REF_NAME) - Content Evolved $VER (#${{ github.run_number }})" \
              --notes "$(printf 'Version de PRUEBA de la rama %s: puede tener errores. Borrador privado: solo lo ve el dueno del repositorio.\n\n%s\n\n## Cambios\n%s' "$GITHUB_REF_NAME" "$NOTAS" "$CAMBIOS")" \
              --draft
          fi

      # Si algo falla (por ejemplo, una version nueva de Content Evolved que rompe el parche),
      # abre un aviso en Issues con el enlace al error. Uno solo a la vez.
      - name: Avisar del error
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITULO="Fallo la compilacion de Evolved"
          if [ -z "$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$TITULO\" in:title" --json number --jq '.[].number')" ]; then
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITULO" --body "$(printf 'La compilacion de Halo C.E Evolved (rama %s, Content Evolved %s) fallo.\n\nError: %s/%s/actions/runs/%s' "$GITHUB_REF_NAME" "${{ steps.version.outputs.ref }}" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")"
          else
            echo "Ya hay un aviso abierto"
          fi
